<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéAPI Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
       <h1>POKEDEX</h1>
    </div>
  <div class="card">
    <div class="infos">
       
        <div class="image">
            <img id="poke-img-front" src="" alt="">
            <img id="poke-img-back" src="" alt="">
        </div>

        <div class="info">
            <label for="pokemon">Nome ou ID do Pokémon:</label>
            <input id="pokemon" type="text" >
            <button class="request" id="poke-button" type="button">Buscar</button>
        </div>
    </div>

    <div class="stats">
       
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
